[package]
name = "gliner2_inference"
version = "0.6.0"
edition = "2021"
authors = ["Dario Finardi <git@semplifica.ai>", "Semplifica s.r.l."]
description = "Native Rust inference engine for GLiNER2 models using ONNX Runtime."
license = "Apache-2.0"
repository = "https://github.com/SemplificaAI/gliner2-rs"

[dependencies]
# Manipolazione Tensor (L'equivalente NumPy per Rust)
ndarray = "0.17"

# Binding ufficiale Rust per ONNX Runtime (versione moderna).
# `default-features = false` disables ort's `download-binaries` (which
# fetches the full ONNX Runtime distribution, including the multi-hundred-
# megabyte CUDA / TensorRT EP DLLs) and `copy-dylibs` (which replicates
# them next to the consumer's binary, where bundlers like Tauri's MSI
# packager auto-include them — inflating downstream installers by 100+ MB
# for zero runtime benefit when the consumer uses load-dynamic against
# its own vendored onnxruntime.dll). The named EP features below stay on
# so the runtime fallback chain in lib.rs / lib_v2.rs keeps compiling;
# absent EPs gracefully fall back to CPU at session-init time. `webgpu`
# adds the Dawn-backed WebGPU EP (Vulkan on Linux, D3D12 on Windows, Metal
# on macOS). Standard prebuilt ONNX Runtime does NOT compile WebGPU into
# libonnxruntime itself — it ships as a separate "plugin EP" shared library
# (e.g. Microsoft.ML.OnnxRuntime.EP.WebGpu's libonnxruntime_providers_webgpu.so)
# that must be registered at runtime via the ORT 1.22+ plugin-EP API
# (`Environment::register_ep_library` + `Environment::devices()` +
# `SessionBuilder::with_devices`, see the `webgpu_devices()` helper below) —
# hence `api-22`. Point `GLINER2_WEBGPU_EP_LIB` at that .so/.dll/.dylib to
# enable it; absent the env var (or the library, or a Vulkan-capable device)
# it's simply not found and the chain falls back the same way as any other
# unavailable EP.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "qnn", "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "webgpu", "api-22", "half"] }

# Tokenizer HuggingFace puro Rust (velocissimo, zero overhead Python)
tokenizers = "0.19.1"

# Gestione base errori ed I/O
anyhow = "1.0"
half = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
hf-hub = "0.5.0"
